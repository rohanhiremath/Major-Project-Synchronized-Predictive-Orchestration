---
# Strong CronJob - Every 10 minutes for frequent scale-ups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: psi-scaleup-generator
  namespace: default
spec:
  schedule: "*/10 * * * *"  # Every 10 minutes
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      parallelism: 6  # 6 pods simultaneously
      completions: 6
      backoffLimit: 1
      activeDeadlineSeconds: 480  # 8 minutes
      template:
        metadata:
          labels:
            app: psi-scaleup-test
            type: strong
        spec:
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - presync-control-plane
          containers:
          - name: memory-stress
            image: polinux/stress
            command:
            - stress
            args:
            - --vm
            - "4"           # 4 workers per pod
            - --vm-bytes
            - "900M"        # 900MB per worker = 3.6GB per pod
            - --vm-hang
            - "0"
            - --timeout
            - "420s"        # Run for 7 minutes
            resources:
              requests:
                memory: "3Gi"
                cpu: "500m"
              limits:
                memory: "4Gi"  # 4GB per pod × 6 pods = 24GB total
                cpu: "1000m"
---
# Initial manual trigger to start immediately
apiVersion: v1
kind: Pod
metadata:
  name: initial-scaleup-trigger
  namespace: default
  labels:
    app: initial-trigger
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - presync-control-plane
  containers:
  - name: memory-bomb
    image: polinux/stress
    command:
    - stress
    args:
    - --vm
    - "5"           # 5 workers
    - --vm-bytes
    - "1G"          # 1GB per worker = 5GB total
    - --vm-hang
    - "0"
    - --timeout
    - "480s"        # 8 minutes
    resources:
      requests:
        memory: "4Gi"
        cpu: "1000m"
      limits:
        memory: "6Gi"
        cpu: "2000m"
