---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-service-config
  namespace: experiment-predictive
data:
  config.yaml: |
    model_path: /models/tft_psi_model.ckpt
    data_path: /data/processed_ptcs.csv
    prediction_interval: 20
    lookback_minutes: 5
    forecast_horizon: 2
    psi_threshold: 1.80
    confirmation_window: 2
    log_predictions: true
    prometheus_port: 8090

---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: experiment-predictive
  labels:
    app: prediction-service
spec:
  selector:
    app: prediction-service
  ports:
  - port: 8090
    targetPort: 8090
    name: metrics
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: experiment-predictive
  labels:
    app: prediction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: prediction-service
        image: python:3.10-slim
        command:
        - /bin/sh
        - -c
        - |
          echo "Installing dependencies..."
          pip install --quiet torch==2.0.1 pytorch-forecasting==1.0.0 pytorch-lightning==2.0.0 pandas numpy prometheus_client requests
          
          echo "Starting prediction service..."
          cd /app
          python3 prediction_service.py
        ports:
        - containerPort: 8090
          name: metrics
        env:
        - name: PROMETHEUS_SERVER
          value: "kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
        - name: NAMESPACE
          value: "experiment-predictive"
        - name: MODEL_PATH
          value: "/models/tft_psi_model.ckpt"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: app
          mountPath: /app
        - name: models
          mountPath: /models
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      
      volumes:
      - name: config
        configMap:
          name: prediction-service-config
      - name: app
        hostPath:
          path: /opt/presync/phase6
          type: Directory
      - name: models
        hostPath:
          path: /opt/presync/models
          type: Directory
      - name: data
        hostPath:
          path: /opt/presync/data
          type: Directory

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prediction-service
  namespace: experiment-predictive
  labels:
    app: prediction-service
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: prediction-service
  endpoints:
  - port: metrics
    interval: 20s
    path: /metrics
