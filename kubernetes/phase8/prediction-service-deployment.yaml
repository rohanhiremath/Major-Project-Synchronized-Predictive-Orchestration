apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-service-config
  namespace: default
data:
  MODEL_PATH: "/models/tft_psi_model.ckpt"
  SPIKE_THRESHOLD: "1.80"
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  PREDICTION_INTERVAL: "20"
  SHADOW_MODE: "true"
  LOG_LEVEL: "INFO"
  METRICS_PORT: "8000"
  API_PORT: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: default
  labels:
    app: prediction-service
spec:
  selector:
    app: prediction-service
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: default
  labels:
    app: prediction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: prediction-service
        image: python:3.9-slim
        command:
        - /bin/bash
        - -c
        - |
          apt-get update && apt-get install -y curl && \
          pip install --no-cache-dir -r /app/requirements.txt && \
          cd /app/kubernetes/phase6 && \
          python3 prediction_service.py
        ports:
        - name: metrics
          containerPort: 8000
        - name: api
          containerPort: 8080
        env:
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: MODEL_PATH
        - name: SPIKE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: SPIKE_THRESHOLD
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: PROMETHEUS_URL
        - name: PREDICTION_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: PREDICTION_INTERVAL
        - name: SHADOW_MODE
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: SHADOW_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: LOG_LEVEL
        - name: METRICS_PORT
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: METRICS_PORT
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: prediction-service-config
              key: API_PORT
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: models
          mountPath: /models
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: app-code
        hostPath:
          path: /home/kesavan-p/Documents/major project/implementation/Major-Project-Synchronized-Predictive-Orchestration
          type: Directory
      - name: models
        hostPath:
          path: /home/kesavan-p/Documents/major project/implementation/Major-Project-Synchronized-Predictive-Orchestration/models
          type: Directory
