apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload-reactive-hpa
  namespace: default
  labels:
    app: workload
    hpa-type: reactive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: workload-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: node_pressure_memory_waiting
      target:
        type: AverageValue
        averageValue: "100m"  # 0.1% threshold
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # Fast scale-up
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min before scale-down
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Min
