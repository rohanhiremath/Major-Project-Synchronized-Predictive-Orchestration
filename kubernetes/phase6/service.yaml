apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: default
  labels:
    app: prediction-service
spec:
  type: ClusterIP
  selector:
    app: prediction-service
  ports:
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
