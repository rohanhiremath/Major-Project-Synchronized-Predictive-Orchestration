apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-service-config
  namespace: default
  labels:
    app: prediction-service
data:
  # Model configuration
  SPIKE_THRESHOLD: "1.80"
  MAX_ENCODER_LENGTH: "30"
  MAX_PREDICTION_LENGTH: "30"
  
  # Prometheus configuration
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-stack-prometheus.monitoring:9090"
  PREDICTION_INTERVAL: "20"
  
  # Pod selection
  POD_LABEL_SELECTOR: "app=workload"
  
  # Service configuration
  SHADOW_MODE: "true"
  LOG_LEVEL: "INFO"
  METRICS_PORT: "9090"
  API_PORT: "8080"
  
  # Model path
  MODEL_PATH: "/app/models/tft_psi_model.ckpt"
