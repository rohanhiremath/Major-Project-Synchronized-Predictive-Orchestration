apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-service-config
  namespace: default
  labels:
    app: prediction-service
data:
  # Model configuration
  # SPIKE_THRESHOLD: project-chosen operating point, not empirically validated.
  # Applied to: deriv(node_pressure_memory_waiting_seconds_total[2m]) * 100
  #             (Prometheus rate-of-change, not cgroup avg10).
  # Host experiment (experiments/psi_threshold_validation/verdict.json) tested
  # cgroup avg10 only. At T=1.8% avg10: recall=0.07 (UNDERPOWERED).
  # At T=1.0% avg10: recall=0.71 (UNDERPOWERED). Prometheus deriv not tested.
  # Do not change until signal mismatch is resolved and deriv signal is validated.
  SPIKE_THRESHOLD: "1.80"
  MAX_ENCODER_LENGTH: "30"
  MAX_PREDICTION_LENGTH: "30"
  
  # Prometheus configuration
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-stack-prometheus.monitoring:9090"
  PREDICTION_INTERVAL: "20"
  
  # Pod selection
  POD_LABEL_SELECTOR: "app=workload"
  
  # Service configuration
  SHADOW_MODE: "true"
  LOG_LEVEL: "INFO"
  METRICS_PORT: "9090"
  API_PORT: "8080"
  
  # Model path
  MODEL_PATH: "/app/models/tft_psi_model.ckpt"
