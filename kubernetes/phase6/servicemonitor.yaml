apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prediction-service
  namespace: default
  labels:
    app: prediction-service
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: prediction-service
  endpoints:
  - port: metrics
    interval: 20s
    path: /metrics
    scheme: http
