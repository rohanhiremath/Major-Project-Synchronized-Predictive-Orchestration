---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: workload-svc
  namespace: default
  labels:
    app: workload
    tier: application
spec:
  clusterIP: None
  selector:
    app: workload
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 9100
    targetPort: 9100
    protocol: TCP
    name: metrics

---
# NodePort Service for external access
apiVersion: v1
kind: Service
metadata:
  name: workload-nodeport
  namespace: default
  labels:
    app: workload
spec:
  type: NodePort
  selector:
    app: workload
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http

---
# ServiceMonitor for Prometheus scraping at 20s interval
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-psi-monitor
  namespace: default
  labels:
    app: workload
    prometheus: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: workload
  endpoints:
  - port: metrics
    interval: 20s
    path: /metrics
    scheme: http
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_label_app]
      targetLabel: app
    metricRelabelings:
    # Keep only PSI metrics and essential node metrics
    - sourceLabels: [__name__]
      regex: 'node_pressure_(cpu|memory|io)_(waiting|stalled)_(seconds_total|ratio)|node_(cpu|memory|filesystem|network).*'
      action: keep
