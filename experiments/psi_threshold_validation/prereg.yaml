# PRE-REGISTERED RULES FOR PSI THRESHOLD VALIDATION EXPERIMENT
# Created: 2026-08-23
# FROZEN: Do not edit after first session starts

# Baseline definition
baseline_p99_B:
  description: "Median of 5s-bin p99 values from calm baseline sessions only"
  source: "calm sessions with no injector activity"
  
# Breach rule (user-visible degradation)
breach_rule:
  definition: "A 5s bin is 'degraded' if p99 > 2.0 * B or error count > 0"
  event_start: "First bin of a run of at least 2 consecutive degraded bins"
  event_merge: "Events separated by < 60s of non-degraded bins are merged"
  rationale: "2x baseline latency is user-noticeable; errors are always degradation"
  
# Alert rule (PSI threshold crossing)
alert_rule:
  description: "Alert fires the first time signal > T for k consecutive samples"
  k_values: [1, 3]
  cooldown_seconds: 60
  rationale: "k=1 for sensitivity, k=3 for confirmation; cooldown prevents alert spam"

# Threshold grid to evaluate
T_grid:
  values: [0.5, 1.0, 1.5, 1.8, 2.0, 2.5, 3.0, 4.0, 5.0]
  unit: "percent"
  description: "PSI memory some avg10 thresholds to test"

# Match rule (does alert detect breach?)
match_rule:
  window_before_onset: 120  # seconds
  window_after_onset: 15    # seconds
  description: "Alert detects breach if alert_time in [onset - 120s, onset + 15s]"
  lead_time: "onset - alert_time (negative = late)"
  false_alarm: "Alert matched to no breach"

# Selection rule (choose best threshold from calibration data)
selection_rule:
  objective: "Maximize event recall"
  constraint: "False alarms <= 2 per hour"
  tie_break_1: "Fewer false alarms"
  tie_break_2: "Higher T (more conservative)"
  failure_condition: "If no (T, k) has recall >= 0.5, record 'no viable threshold'"
  applies_to: "CALIBRATION sessions only"

# Test rule (one-shot evaluation)
test_rule:
  evaluate:
    - "Selected (T, k) from calibration"
    - "Project's configured T=1.8 with same k"
  run_once: true
  description: "Evaluate on TEST sessions exactly once, no tuning allowed"

# Verdict rule for T=1.8 on TEST
verdict_rule:
  T_target: 1.8
  SUPPORTED_FOR_THIS_WORKLOAD:
    condition: "Event recall >= 0.8 AND false alarms <= 2 per hour"
  NOT_SUPPORTED:
    condition: "Either recall < 0.8 OR false alarms > 2 per hour"
  UNDERPOWERED:
    condition: "Test set has < 10 breach events OR < 3 hours monitored time"
    overrides: true

# Session assignment rule
session_assignment:
  rule: "Odd session numbers → CALIBRATION, Even → TEST"
  calm_sessions: "Alternate starting with calibration"
  run_order: "Interleave profiles (do not run all of one profile back to back)"
  
# Target event counts
target_events:
  calibration_min: 15
  test_min: 10
  max_sessions: 18  # 12 initial + up to 6 additional
  underpowered_if_insufficient: true

# Provenance
frozen_at: "2026-08-23T00:00:00Z"
commit_or_hash: "to be recorded when experiment starts"
notes:
  - "This file must not be edited after the first session starts"
  - "All rules are pre-registered before seeing any PSI-vs-latency data"
  - "Violation of these rules invalidates the experiment"
