# PRE-REGISTERED RULES — PSI Threshold Validation v2
# Signal: deriv(node_pressure_memory_waiting_seconds_total[2m]) * 100
# Frozen: 2026-10-18  before any calibration or test analysis is run.
# Do not edit this file after the first analysis script runs.
# signal_definition.md SHA256: 61484120305457364fda4bcd50afa9f178c962b061fa810b5458a649078bacb0

# ─────────────────────────────── Signal ────────────────────────────────

signal:
  name: psi_memory_deriv_pct
  prometheus_query: >
    deriv(node_pressure_memory_waiting_seconds_total{pod=~"workload-app-.*"}[2m]) * 100
  source_column: psi_some_avg10
  dataset_files:
    calibration: data/train.csv
    test:        [data/validation.csv, data/test.csv]
  units: percent
  sampling_interval_s: 20
  non_negativity: values below zero clamped to 0.0 before use
  sha256:
    train.csv:      3a636ac20df412cda0f22f6cfe5b9ac6e69b66b5cfefa47b0807fee80393955b
    test.csv:       ee52a4f55439d41a57f1c0121d08203f4351695042a1f7fc79061c7313bd417d
    validation.csv: a5aa59626f1d59abf42fa52b28b0d0e7ddaec1782b16b185711f9221f4118c9c

# ─────────────────────────────── Baseline B ────────────────────────────

baseline_B:
  definition: >
    Median of latency_ms values across all rows in the CALIBRATION file
    (data/train.csv) where psi_some_avg10 == 0.0 exactly.
    Computed once from calibration data only; never updated after seeing test data.
  value_ms: 60.34
  source: train.csv rows where psi_some_avg10 == 0.0 (6677 rows, 32.2% of train)
  rationale: >
    Rows with PSI=0 represent periods of no memory reclaim pressure.
    Their latency distribution is the system's baseline.
    The median is used (not mean) to be robust to transient outliers.

# ─────────────────────────────── Outcome label ─────────────────────────

breach_rule:
  degraded_row: >
    A row is degraded if latency_ms > 2.0 * B  (i.e. > 120.68 ms).
    Error-rate is NOT used as a degradation criterion because the dataset
    has no zero-error baseline rows; all rows carry a non-zero background
    error rate.
  breach_event_start: >
    The first row of a run of 2 or more consecutive degraded rows.
    Run length is counted per series_id, in time_idx order.
  merge_rule: >
    Two breach events in the same series are merged into one if the gap
    between the end of the earlier event and the start of the later event
    is fewer than 3 rows (< 60 s at 20 s/row).
  note: >
    Latency is measured by the external workload generator and stored in
    latency_ms. It is never derived from PSI or from the threshold.

# ─────────────────────────────── Alert rule ────────────────────────────

alert_rule:
  description: >
    An alert fires the first time psi_some_avg10 > T for k consecutive rows
    in the same series (no gap).
  k_values: [1, 3]
  cooldown_rows: 3
  cooldown_seconds: 60
  note: >
    After an alert fires, suppress further alerts for 3 rows (60 s).
    The consecutive-row count resets to 0 after an alert fires.

# ─────────────────────────────── Match rule ────────────────────────────

match_rule:
  window_before_onset_s: 120
  window_after_onset_s:  180
  description: >
    An alert detects a breach event if alert_time is within
    [onset - 120 s, onset + 180 s].
    onset = timestamp of the first row of the breach event.
    alert_time = timestamp of the row on which the alert fired.
    DEVIATION FROM ORIGINAL: post-onset window extended from 15s to 180s.
    Reason: lag analysis on calibration data shows PSI (deriv[2m]) fires
    AFTER latency onset by a median of +20s (T=1.0%) to +80s (T=1.8%).
    At T=1.8%, median lag is +80s; a +15s window would miss all but 2/67 events.
    The extended window covers the observed lag distribution (p75=+140s at T=1.8%).
    This change is recorded as a pre-analysis deviation in experiment_log.md.
  lead_time: >
    lead_time_s = onset_time - alert_time.
    Positive = alert fired before onset (true early warning).
    Negative = alert fired after onset (reactive). Negative values are expected
    for this signal because PSI is a lagging indicator of latency for the
    deriv([2m]) formulation.
  false_alarm: >
    An alert that is not matched to any breach event within its detection
    window is counted as a false alarm.
  one_alert_per_event: >
    Each breach event can be matched to at most one alert (the earliest
    alert in the window). Subsequent alerts in the same window do not
    count as additional detections.

# ─────────────────────────────── Threshold grid ────────────────────────

T_grid:
  values: [0.5, 1.0, 1.5, 1.8, 2.0, 2.5, 3.0, 4.0, 5.0, 6.0, 7.0, 8.0, 9.0]
  units: percent
  rationale: >
    Grid spans 0.5 to 9.0 to cover the full observed signal range
    (max 9.71 % in train.csv). T=1.8 is the project-configured value
    and must appear in the grid. Steps are finer below 3.0 where most
    events are expected to concentrate.

# ─────────────────────────────── Selection rule ────────────────────────

selection_rule:
  applies_to: calibration data only (data/train.csv)
  objective: maximize event recall
  constraint: false_alarms_per_hour <= 2.0
  tie_break_1: fewer total false alarms
  tie_break_2: higher T (prefer more conservative threshold)
  failure_condition: >
    If no (T, k) pair achieves recall >= 0.5 AND false_alarms_per_hour <= 2.0,
    record "no_viable_threshold" and do not select.
  note: >
    Selection is applied once, before the test data is opened.
    The selected (T, k) and T=1.8 with the same k are then evaluated
    on the test data exactly once.

# ─────────────────────────────── Pass criteria ─────────────────────────

pass_criteria:
  note: >
    These criteria are pre-stated and applied exactly as written.
    They are not adjusted after seeing test results.
  supported:
    condition: >
      Wilson 95% lower bound on recall >= 0.60
      AND false_alarm_rate_upper_bound_per_hour <= 2.0
      (upper bound = (FA_count + 1.96*sqrt(FA_count + 0.96)) / monitored_hours
       using the Poisson/normal approximation for rare events)
  not_supported:
    condition: either criterion fails
  underpowered:
    condition: >
      Test set has fewer than 15 breach events
      OR total test monitored time < 3.0 hours.
      UNDERPOWERED overrides SUPPORTED or NOT_SUPPORTED.
  note_on_current_data: >
    data/test.csv + data/validation.csv together contain 6 series over
    ~4.8 hours. Event count will be computed by the analysis script.
    If fewer than 15 events are found, the verdict is UNDERPOWERED.

# ─────────────────────────────── Session assignment ────────────────────

session_assignment:
  calibration:
    file: data/train.csv
    series: [server_01_segment_0, server_02_segment_0, server_03_segment_0,
             server_04_segment_0, server_05_segment_0, server_06_segment_0]
    time_range: "2026-08-21 00:00:00 to 2026-08-21 19:11:40"
    rows: 20736
    monitored_hours: 115.20
  test:
    files: [data/validation.csv, data/test.csv]
    series: [server_01_segment_0, server_02_segment_0, server_03_segment_0,
             server_04_segment_0, server_05_segment_0, server_06_segment_0]
    time_range: "2026-08-21 19:12:00 to 2026-08-21 23:59:40"
    rows: 5184
    monitored_hours: 28.80
  assignment_rule: >
    Assignment is determined by dataset split, which was fixed at data
    collection time. train.csv = calibration. test.csv + validation.csv
    = test. No reassignment is permitted.
  note: >
    All three files cover the same 6 server series over non-overlapping
    time windows on 2026-08-21. The train/validation/test split was
    applied chronologically: train is the first ~80% of the day,
    validation and test cover the final ~20%.

# ─────────────────────────────── Tests to run ──────────────────────────

tests:
  test_1_signal_sanity:
    description: >
      Using all calibration rows, compute AUC of psi_some_avg10 for
      predicting the per-row breach label (latency_ms > 2*B).
      Report calm/stress signal distributions: median, p90, p95, p99, max.
      If AUC < 0.55, the signal carries no information; stop.
    stop_condition: AUC < 0.55
  test_3_calibration_sweep:
    description: >
      For every (T, k) in T_grid x k_values, compute on calibration only:
      event recall, events detected, false alarms per hour, precision,
      lead time median and IQR.
      Apply selection_rule. Write calibration_sweep_v2.json and selected_v2.json.
  test_4_held_out:
    description: >
      Apply the selected (T, k) and T=1.8 with the same k to test data.
      Compute: recall with counts, Wilson 95% CI, false alarms per hour
      with total monitored hours, precision, lead time median/IQR.
      Apply pass_criteria exactly.
      Write test_results_v2.json and verdict_v2.json.
      Run once. Do not re-run with different parameters.
    bootstrap:
      iterations: 2000
      seed: 42
      unit: series (resample series with replacement)

# ─────────────────────────────── Provenance ────────────────────────────

frozen_at: "2026-10-18"
signal_definition_sha256: 61484120305457364fda4bcd50afa9f178c962b061fa810b5458a649078bacb0
note: >
