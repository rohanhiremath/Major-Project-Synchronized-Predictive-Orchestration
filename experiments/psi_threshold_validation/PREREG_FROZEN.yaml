# TEST 0 RESULTS: SIGNAL LOCKED
signal:
  name: "psi_memory_deriv_pct"
  query: "deriv(node_pressure_memory_waiting_seconds_total{pod=~\"workload-app-.*\"}[2m]) * 100"
  description: "Prometheus rate-of-change of PSI memory waiting counter, scaled to percent"
  source_in_production: "kubernetes/phase6/prediction_service.py line 267"
  units: "%"
  sampling_interval_seconds: 20
  data_columns:
    - train.csv: "psi_some_avg10"
    - test.csv: "psi_some_avg10"
    - validation.csv: "psi_some_avg10"
  range_in_data:
    min: 0.0
    max: 9.7081
    p50: 0.0232
    p90: 2.9757
    p99: 7.3724
  locked_date: "2026-10-18"
  no_switch_permitted: true
  reason_locked: "Production uses this signal; matches training data"

---
# TEST 1 RESULTS: LABEL (BREACH DEFINITION) LOCKED
label:
  name: "breach_label"
  definition: |
    A breach event is when latency_ms > 2.0 * B for 2+ consecutive 20s bins.
  derivation: |
    1. B = baseline latency = median(latency_ms) where psi_some_avg10 == 0.0 (train.csv only)
    2. B = 60.34 ms (per Test 1)
    3. Threshold = 2 * B = 120.68 ms
    4. Per-bin: if latency_ms > 120.68 ms, mark as above threshold
    5. Event: 2+ consecutive bins above threshold = breach event
    6. Example: bins [i, i+1] both > 120.68 ms → bins [i, i+1] count as 1 event
  source_variables: ["latency_ms", "error_rate"]
  psi_never_used_in_label: true
  independence_verified: true
  correlation_to_signal_calm_bins: "NaN (zero variance)"
  correlation_to_signal_stress_bins: "0.9996-0.9998 (co-generated artifact, per Test 1)"
  baseline_B_ms: 60.34
  threshold_2B_ms: 120.68
  locked_date: "2026-10-18"
  no_retroactive_redefinition_permitted: true

