---
# FALSE ALARM DEFINITIONS (Two versions, primary first)
false_alarm_definitions:
  primary:
    name: "per_alert"
    definition: |
      Count each alert as one false alarm.
      FA_count = number of alerts in calm periods (psi_some_avg10 == 0.0)
      FA/hr = FA_count / calm_hours
    rationale: "Operational metric: alerts to ops/hr"
    used_for: "Pre-registered verdict"
    locked: true
  
  exploratory:
    name: "per_event"
    definition: |
      Aggregate alerts within each event (breach or false-positive event).
      One event = one breach or one period of elevated signal.
      per_event_FA = false-positive events / total events in calm periods
      [Not used for official verdict; exploratory alternative only]
    rationale: "Investigative: false alerts per distinct anomaly"
    used_for: "Post-hoc analysis only (not official verdict)"
    locked: false
    caveat: "Can only be tested on new, held-out data if reconsidered"

---
# ALERT RULE (Locked)
alert_rule:
  definition: |
    Alert fires when signal > T for k consecutive 20s bins.
  parameters:
    T_grid:
      - 0.5
      - 1.0
      - 1.5
      - 1.8
      - 2.0
      - 2.5
      - 3.0
      - 4.0
      - 5.0
      - 6.0
      - 7.0
      - 8.0
      - 9.0
    k_values:
      - 1
      - 3
    cooldown_seconds: 60
    cooldown_bins: 3
  interpretation: |
    Alert is generated per (T, k) pair on calibration data.
    For each alert, record: timestamp, pod, threshold value.
  locked_date: "2026-10-18"

---
# SELECTION RULE (Locked)
selection_rule:
  objective: "Maximize recall subject to FA/hr <= 2.0"
  constraint_fa_per_hour: 2.0
  constraint_recall_minimum: 0.5
  tie_breaking:
    1: "Fewer false alarms"
    2: "Higher threshold (prefer conservative)"
  applied_on: "Calibration data only"
  applied_before: "Test evaluation begins"
  frozen_date: "2026-10-18"
  output:
    selected_T: "[computed during analysis]"
    selected_k: "[computed during analysis]"
    status_if_no_viable: "report no_viable_threshold and STOP"

---
# PASS CRITERIA (Locked)
pass_criteria:
  primary_threshold: "selected (T, k) from calibration sweep"
  project_configured: "T=1.8%, k=1"
  
  test_for_selected:
    wilson_ci_lower_bound_on_recall: ">= 0.60"
    fa_upper_bound_per_hour: "<= 2.0"
    both_must_pass: true
    verdict_if_pass: "SUPPORTED"
    verdict_if_fail: "NOT_SUPPORTED"
  
  test_for_project_configured:
    wilson_ci_lower_bound_on_recall: ">= 0.60"
    fa_upper_bound_per_hour: "<= 2.0"
    both_must_pass: true
    verdict_if_pass: "SUPPORTED (project threshold)"
    verdict_if_fail: "NOT_SUPPORTED (project threshold)"
  
  wilson_ci_method: "normal approximation, 95% two-sided"
  bootstrap_iterations: 2000
  bootstrap_seed: 42
  bootstrap_resampling_unit: "per-session (resampling whole sessions, not individual bins)"

---
# STOP RULES (Locked)
stop_rules:
  underpowered:
    condition: "calibration_events < 15 OR test_events < 15 OR test_hours < 3.0"
    action: "Stop. Report UNDERPOWERED. Do not proceed to verdict."
    verdict: "UNDERPOWERED"
  
  no_viable_threshold:
    condition: "No (T, k) satisfies recall >= 0.5 AND FA/hr <= 2.0 simultaneously"
    action: "Stop. Report no_viable_threshold. Skip test evaluation."
    verdict: "NO_VIABLE_THRESHOLD"
  
  test_fails:
    condition: "Selected (T, k) fails pass criteria on test data"
    action: "Report failure. Do not select new threshold from test data."
    verdict: "NOT_SUPPORTED"

