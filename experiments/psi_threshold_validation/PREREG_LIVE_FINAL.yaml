# ANALYSIS PIPELINE (LOCKED)
analysis_pipeline:
  sequence:
    1:
      name: "Signal sanity"
      description: "AUC on stress bins, signal distribution"
      scope: "calibration stress bins only"
      output: "test_1_live_signal_sanity.json"
    
    2:
      name: "Label independence (lag profile)"
      description: "Cross-correlation signal vs latency at various lags"
      scope: "calibration stress bins"
      output: "test_2_live_lag_analysis.json"
      expected_finding: "If lag profile peaks at positive lag, signal lags outcome. If flat, co-movement."
    
    3:
      name: "Calibration sweep"
      description: "All (T, k) pairs; compute recall, FA/hr, precision"
      scope: "calibration data"
      output: "test_3_live_calibration_sweep.json"
    
    4:
      name: "Selection"
      description: "Apply selection rule; identify (T*, k*)"
      scope: "calibration results"
      output: "test_4_live_selection_result.json"
    
    5:
      name: "Held-out test"
      description: "Evaluate selected (T*, k*) and T=1.8% on test data"
      scope: "test data"
      output: "test_5_live_test_evaluation.json"
    
    6:
      name: "Chance check"
      description: "Shuffle breach labels 1000 times; verify result is not by chance"
      scope: "test data"
      output: "test_6_live_chance_check.json"
  
  no_data_peeking: true
  no_retroactive_selection: true
  run_once_only: true

