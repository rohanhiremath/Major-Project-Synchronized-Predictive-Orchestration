---
# SIGNAL DEFINITION (LOCKED)
signal:
  name: "pod_psi_some_avg10"
  source: "Kernel cgroup memory.pressure file"
  cgroup_path: "/sys/fs/cgroup/user.slice/user-1000.slice/user@1000.service/app.slice/psitest.scope/memory.pressure"
  field: "some" line, "avg10" column
  units: "%"
  sampling_interval: "20 seconds"
  collection_method: "Direct read from cgroup (not Prometheus derivative)"
  
  # Note: This is cgroup-level PSI, not node-level
  # Production uses Prometheus deriv signal; this is closest real measurement
  data_source_in_csv: "metrics.csv column 'pod_psi_some_avg10'"
  
  expected_range: "0.0 – 5.0% (stress-induced; cgroup-level only)"
  locked_date: "2026-10-18"
  no_switch_permitted: true

---
# BASELINE (LOCKED)
baseline:
  name: "B"
  definition: "Median p99_latency_ms where pod_psi_some_avg10 == 0.0"
  computation: "Computed from calibration calm sessions only"
  source_file: "metrics.csv from all calibration sessions"
  
  # To be computed before analysis:
  # 1. Extract all rows from calibration calm sessions (cal_calm_1, cal_calm_2, cal_calm_3)
  # 2. Filter to rows where pod_psi_some_avg10 == 0.0
  # 3. Compute median(p99_latency_ms)
  # 4. Lock this value before threshold selection
  
  expected_value: "~9 ms (from initial inspection)"
  threshold_2B: "2.0 * B (to be computed)"
  locked_before_analysis: true

---
# BREACH LABEL (LOCKED)
label:
  name: "breach_label"
  definition: |
    A breach event is marked when p99_latency_ms > 2.0 * B (degradation threshold)
    for 2 or more consecutive 20-second bins.
  derivation: |
    1. Compute B = median(p99_latency_ms) where pod_psi_some_avg10 == 0.0
    2. Threshold T_breach = 2 * B
    3. Per-bin: breach = 1 if p99_latency_ms > T_breach, else 0
    4. Event: breach_label = 1 if bin[i] == 1 AND bin[i+1] == 1, else 0
    5. This marks consecutive breached bins as part of the same event
  
  source_variables: ["p99_latency_ms"]
  psi_never_used_in_label: true
  label_independence_verified: true
  
  # Note: error_rate is available but not used in primary breach rule
  # error_rate is < 0.5% throughout; primary driver is latency
  
  note: "Label is external measurement (client p99), never reads PSI"
  locked_date: "2026-10-18"
  no_retroactive_redefinition_permitted: true

---
# FALSE ALARM DEFINITIONS (TWO VERSIONS)
false_alarm_definitions:
  primary:
    name: "per_alert"
    definition: |
      Count each alert firing as one false alarm (FA).
      FA_count = number of alert transitions (rising edge) in calm periods
      FA/hr = FA_count / calm_hours_total
    
    rationale: "Operational metric: how many alerts would ops receive per hour?"
    used_for: "Official pre-registered verdict"
    locked: true
    
    # Alert transition: signal crosses T from below to above
    # (To avoid counting sustained elevation as multiple FAs)
    
  exploratory:
    name: "per_event"
    definition: |
      Group alerts into events (contiguous periods of signal elevation).
      per_event_FA = false-positive events / total monitoring time
      
      Example: if signal stays > T for 60 seconds, count as 1 event
      (not multiple alerts per time step)
    
    rationale: "Investigative metric: how many distinct anomalies are false?"
    used_for: "Post-hoc analysis only (not official verdict)"
    locked: false
    caveat: "Can only be tested on new data if reconsidered; do not use test data"

---
# ALERT RULE (LOCKED)
alert_rule:
  definition: |
    Alert fires when signal > T for k consecutive 20-second bins.
  
  parameters:
    T_grid:
      - 0.5
      - 1.0
      - 1.5
      - 1.8
      - 2.0
      - 2.5
      - 3.0
      - 4.0
      - 5.0
    
    k_values:
      - 1
      - 3
    
    cooldown_seconds: 60
    cooldown_bins: 3
  
  interpretation: |
    For each (T, k) pair:
    - Mark bins where pod_psi_some_avg10 > T
    - Group into consecutive runs
    - If run has k+ consecutive bins, fire alert(s)
    - Apply 60s cooldown to avoid alert spam
  
  locked_date: "2026-10-18"

---
# SELECTION RULE (LOCKED)
selection_rule:
  objective: "Maximize recall subject to FA/hr <= 2.0"
  
  constraints:
    fa_per_hour_max: 2.0
    recall_minimum: 0.5
  
  tie_breaking:
    1: "Fewer false alarms"
    2: "Higher threshold (prefer conservative)"
    3: "Lower k (fewer consecutive bins required)"
  
  applied_on: "Calibration data only"
  applied_before: "Test evaluation begins"
  
  stop_condition: "If no (T, k) meets both constraints, report 'no_viable_threshold' and stop"
  
  frozen_date: "2026-10-18"

---
# PASS CRITERIA (LOCKED)
pass_criteria:
  for_selected_threshold:
    criterion_1: "Wilson 95% CI lower bound on recall >= 0.60"
    criterion_2: "FA/hr upper bound (95% CI) <= 2.0"
    both_must_pass: true
    verdict_if_both_pass: "SUPPORTED"
    verdict_if_either_fails: "NOT_SUPPORTED"
  
  for_project_configured:
    # Project default is T=1.8%, k=1
    T: 1.8
    k: 1
    criterion_1: "Same as above"
    criterion_2: "Same as above"
    verdict_if_supported: "SUPPORTED (project threshold)"
    verdict_if_not: "NOT_SUPPORTED (project threshold)"
  
  wilson_ci_method: "normal approximation, two-sided 95%"
  
  bootstrap:
    iterations: 2000
    seed: 42
    resampling_unit: "per-session (whole sessions resampled, not individual bins)"

---
# STOP RULES (LOCKED)
stop_rules:
  underpowered:
    condition: "calibration_breach_events < 15 OR test_breach_events < 15 OR test_hours < 3.0"
    action: "Stop. Report event counts and test hours. Do not proceed to verdict."
    verdict: "UNDERPOWERED"
  
  no_viable_threshold:
    condition: "No (T, k) pair satisfies recall >= 0.5 AND FA/hr <= 2.0 simultaneously on calibration"
    action: "Stop. Report all (T, k) results. Skip test evaluation."
    verdict: "NO_VIABLE_THRESHOLD"
  
  test_fails:
    condition: "Selected (T, k) fails pass criteria on test data (both criteria must pass)"
    action: "Report failure. Do not select new (T, k) from test data."
    verdict: "NOT_SUPPORTED"

---
