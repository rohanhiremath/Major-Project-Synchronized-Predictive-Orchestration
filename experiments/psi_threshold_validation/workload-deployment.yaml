apiVersion: v1
kind: Namespace
metadata:
  name: psi-experiment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-scripts
  namespace: psi-experiment
data:
  workload_service.py: |
    #!/usr/bin/env python3
    import os
    import time
    import random
    from datetime import datetime
    from flask import Flask, jsonify
    import psutil
    
    app = Flask(__name__)
    
    MEMORY_LIMIT_MB = 256
    TARGET_WORKING_SET_PCT = 0.70
    ALLOCATION_PER_REQUEST_KB = 512
    
    cache = {}
    cache_size_target = int(MEMORY_LIMIT_MB * TARGET_WORKING_SET_PCT * 1024 * 1024)
    
    def initialize_cache():
        print(f"Initializing cache to {cache_size_target / 1024 / 1024:.1f} MB...")
        chunk_size = 1024 * 1024
        num_chunks = cache_size_target // chunk_size
        for i in range(num_chunks):
            cache[f'chunk_{i}'] = bytearray(chunk_size)
            for j in range(0, chunk_size, 4096):
                cache[f'chunk_{i}'][j] = random.randint(0, 255)
        process = psutil.Process()
        mem_info = process.memory_info()
        print(f"Cache initialized. RSS: {mem_info.rss / 1024 / 1024:.1f} MB")
    
    @app.route('/health')
    def health():
        return jsonify({'status': 'healthy', 'timestamp': datetime.now().isoformat()})
    
    @app.route('/work')
    def work():
        start_time = time.time()
        temp_data = bytearray(ALLOCATION_PER_REQUEST_KB * 1024)
        for i in range(0, len(temp_data), 4096):
            temp_data[i] = random.randint(0, 255)
        num_accesses = random.randint(10, 50)
        cache_keys = list(cache.keys())
        for _ in range(num_accesses):
            if cache_keys:
                key = random.choice(cache_keys)
                _ = cache[key][0]
        time.sleep(random.uniform(0.001, 0.01))
        latency = (time.time() - start_time) * 1000
        return jsonify({'status': 'ok', 'latency_ms': latency, 'timestamp': datetime.now().isoformat()})
    
    @app.route('/stats')
    def stats():
        process = psutil.Process()
        mem_info = process.memory_info()
        return jsonify({
            'rss_mb': mem_info.rss / 1024 / 1024,
            'vms_mb': mem_info.vms / 1024 / 1024,
            'cache_keys': len(cache),
            'memory_limit_mb': MEMORY_LIMIT_MB
        })
    
    if __name__ == '__main__':
        print("Initializing HTTP service...")
        initialize_cache()
        app.run(host='0.0.0.0', port=8080, threaded=True)
  
  memory_injector.py: |
    #!/usr/bin/env python3
    import os
    import time
    import random
    from pathlib import Path
    from flask import Flask, jsonify, request
    import psutil
    
    app = Flask(__name__)
    
    SAFETY_CAP_MB = 1107
    injector_state = {
        'active': False,
        'target_mb': 0,
        'current_mb': 0,
        'allocated_chunks': [],
        'mode': 'idle'
    }
    
    def allocate_memory(target_mb):
        chunk_size_mb = 10
        chunk_size_bytes = chunk_size_mb * 1024 * 1024
        current_mb = injector_state['current_mb']
        if target_mb > current_mb:
            needed_mb = target_mb - current_mb
            num_chunks = int(needed_mb / chunk_size_mb)
            print(f"Allocating {needed_mb:.0f} MB...")
            for i in range(num_chunks):
                chunk = bytearray(chunk_size_bytes)
                for j in range(0, chunk_size_bytes, 4096):
                    chunk[j] = random.randint(0, 255)
                injector_state['allocated_chunks'].append(chunk)
                injector_state['current_mb'] += chunk_size_mb
                if i % 10 == 0:
                    time.sleep(0.01)
            print(f"Allocated to {injector_state['current_mb']:.0f} MB")
        elif target_mb < current_mb:
            release_mb = current_mb - target_mb
            num_chunks_release = int(release_mb / chunk_size_mb)
            print(f"Releasing {release_mb:.0f} MB...")
            for _ in range(num_chunks_release):
                if injector_state['allocated_chunks']:
                    injector_state['allocated_chunks'].pop()
                    injector_state['current_mb'] -= chunk_size_mb
            print(f"Released to {injector_state['current_mb']:.0f} MB")
    
    @app.route('/health')
    def health():
        return jsonify({'status': 'healthy'})
    
    @app.route('/status')
    def status():
        process = psutil.Process()
        mem_info = process.memory_info()
        return jsonify({
            'active': injector_state['active'],
            'mode': injector_state['mode'],
            'target_mb': injector_state['target_mb'],
            'current_mb': injector_state['current_mb'],
            'rss_mb': mem_info.rss / 1024 / 1024,
            'safety_cap_mb': SAFETY_CAP_MB
        })
    
    @app.route('/inject', methods=['POST'])
    def inject():
        data = request.json
        target_mb = min(data.get('target_mb', 0), SAFETY_CAP_MB)
        injector_state['active'] = True
        injector_state['target_mb'] = target_mb
        injector_state['mode'] = data.get('mode', 'sustained')
        allocate_memory(target_mb)
        return jsonify({'status': 'ok', 'target_mb': target_mb, 'current_mb': injector_state['current_mb']})
    
    @app.route('/release', methods=['POST'])
    def release():
        allocate_memory(0)
        injector_state['active'] = False
        injector_state['mode'] = 'idle'
        return jsonify({'status': 'ok', 'current_mb': injector_state['current_mb']})
    
    if __name__ == '__main__':
        print("Memory injector starting...")
        app.run(host='0.0.0.0', port=8081, threaded=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psi-workload
  namespace: psi-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psi-workload
  template:
    metadata:
      labels:
        app: psi-workload
    spec:
      containers:
      - name: http-service
        image: python:3.11-slim
        command:
          - /bin/bash
          - -c
          - |
            pip install -q flask psutil && \
            python3 /scripts/workload_service.py
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
      
      - name: memory-injector
        image: python:3.11-slim
        command:
          - /bin/bash
          - -c
          - |
            pip install -q flask psutil && \
            python3 /scripts/memory_injector.py
        ports:
        - containerPort: 8081
          name: injector
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "1200Mi"
            cpu: "200m"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
      
      volumes:
      - name: scripts
        configMap:
          name: workload-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: psi-workload
  namespace: psi-experiment
spec:
  type: NodePort
  selector:
    app: psi-workload
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
  - name: injector
    port: 8081
    targetPort: 8081
    nodePort: 30081
